<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一段五分钟左右的短旅程。" />
    <!-- Match --fog in src/style.css. -->
    <meta
      name="theme-color"
      content="#dde5e8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b252d"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>来时路</title>
    <!-- Link previews. Crawlers need absolute URLs, so these name the
         GitHub Pages address; public/og.png is the image. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="来时路" />
    <meta
      property="og:description"
      content="一段五分钟左右的短旅程。出发前写下一句理由，路上的人会一遍遍转述它，到了山顶，你要凭记忆把它写回那卷空白的经上。"
    />
    <meta
      property="og:url"
      content="https://weiguang-2099.github.io/road-we-came/"
    />
    <meta
      property="og:image"
      content="https://weiguang-2099.github.io/road-we-came/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="月白底上竖排楷体写着“来时路”，下方一行小字“一段五分钟左右的短旅程。”"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="app"></main>
    <noscript>
      <p>这个游戏需要启用 JavaScript。</p>
      <p lang="en">This game needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
